# Builds the Android debug APK in the cloud — no local Android SDK needed.
# Download from the run's Artifacts (or attach to a GitHub Release later).
#
# The APK bundles the web app; its API endpoint comes from the repo VARIABLE
# VITE_API_URL (Settings → Secrets and variables → Actions → Variables).
# Default below is a placeholder — set the real domain before pilot rollout.

name: android-apk

on:
  push:
    branches: [main]
    paths: ["web/**", "android/**", "capacitor.config.json", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Ubuntu runners ship with the Android SDK preinstalled at $ANDROID_HOME;
      # just make sure all licenses are accepted so Gradle can auto-install gaps.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build PWA bundle (web assets get bundled into the APK)
        working-directory: web
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://sdm-kapalbaja.my.id' }}

      - name: Install root deps and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: simdik-kapalbaja-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
