# Production: API + PWA behind the existing Cloudflare Tunnel on the VPS.
# Copy .env.example to .env and fill real secrets before up.
services:
  api:
    build: ./api
    container_name: simdik-api
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: file:/data/simdik.db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set in .env}
    volumes:
      - api-data:/data
    ports:
      # localhost-only; the tunnel reaches the container via the docker network
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-https://mentor.kapalbaja.web.id}
    container_name: simdik-web
    restart: unless-stopped
    depends_on:
      - api

volumes:
  api-data:
