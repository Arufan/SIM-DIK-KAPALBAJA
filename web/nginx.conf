# PWA host + API reverse proxy on one origin (mentor.kapalbaja.web.id).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API paths -> Node API container (compose network DNS)
  location ~ ^/(auth|sync|health|caang|weekly-evals|stage-evals)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Service worker must always revalidate so updates land immediately
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # hashed assets cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
